# Escalado automático: preparado para crecer a 1M+ de usuarios
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nutriscan-api
  namespace: nutriscan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nutriscan-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
