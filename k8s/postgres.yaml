# Nota producción: en Google Cloud se recomienda Cloud SQL para PostgreSQL
# (alta disponibilidad y backups gestionados). Este StatefulSet sirve para
# entornos de staging o clústeres autogestionados.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nutriscan
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nutriscan
            - name: POSTGRES_USER
              value: nutriscan
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nutriscan-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nutriscan
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
