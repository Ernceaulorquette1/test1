name: nutriscan_ai
description: "NutriScan AI — Tu asistente inteligente de nutrición. Escanea tus comidas y calcula calorías con IA."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado (MVVM) e inyección de dependencias
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # Red
  dio: ^5.5.0

  # Firebase (auth, storage, mensajería)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Cámara / galería y escáner
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1

  # Gráficos
  fl_chart: ^0.68.0

  # Compras dentro de la app (Google Play Billing)
  in_app_purchase: ^3.2.0

  # Utilidades
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
