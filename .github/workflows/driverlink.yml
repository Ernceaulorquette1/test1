name: DriverLink

on:
  push:
    paths:
      - "driverlink/**"
      - ".github/workflows/driverlink.yml"
  pull_request:
    paths:
      - "driverlink/**"
  workflow_dispatch:

jobs:
  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driverlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (demo)
        run: ./gradlew --no-daemon testDemoDebugUnitTest
      - name: Build demo APK
        run: ./gradlew --no-daemon assembleDemoDebug
      - name: Build prod (sin google-services.json)
        run: ./gradlew --no-daemon compileProdDebugKotlin
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon compileDemoDebugAndroidTestKotlin
      - name: Lint (demo)
        run: ./gradlew --no-daemon lintDemoDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driverlink-reports
          path: |
            driverlink/app/build/reports/
            driverlink/app/build/outputs/apk/demo/debug/*.apk

  firebase:
    name: Firebase (functions + security rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driverlink/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cloud Functions (typecheck + tests)
        run: npm ci --prefix functions && npm --prefix functions test
      - name: Security rules (emulator)
        run: |
          npm ci --prefix rules-tests
          npx --yes firebase-tools@13 emulators:exec --project demo-driverlink --only firestore,storage "npm --prefix rules-tests test"
