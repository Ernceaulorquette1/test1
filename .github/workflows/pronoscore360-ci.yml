name: PronoScore360 CI
on:
  push:
    branches: [main, master, "ccr-**"]
    paths: ["PronoScore360/**", ".github/workflows/pronoscore360-ci.yml"]
  pull_request:
    paths: ["PronoScore360/**"]
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install pytest -e PronoScore360/analytics
      - run: cd PronoScore360/analytics && python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pronoscore, POSTGRES_PASSWORD: pronoscore, POSTGRES_DB: pronoscore_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pronoscore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pronoscore:pronoscore@localhost:5432/pronoscore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r PronoScore360/backend/requirements-dev.txt -e PronoScore360/analytics
      - name: Migraciones (subir, bajar, subir) y coherencia con los modelos
        run: |
          cd PronoScore360/backend
          export DATABASE_URL=$TEST_DATABASE_URL PYTHONPATH=.
          alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - run: cd PronoScore360/backend && python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: PronoScore360/web/package-lock.json }
      - run: cd PronoScore360/web && npm ci
      - run: cd PronoScore360/web && npm run typecheck && npm test && npm run build

  integration:
    name: integración web + Android-core ↔ backend real
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pronoscore, POSTGRES_PASSWORD: pronoscore, POSTGRES_DB: pronoscore }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pronoscore" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: PronoScore360/web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install -r PronoScore360/backend/requirements.txt -e PronoScore360/analytics
      - run: cd PronoScore360/web && npm ci
      - name: Arrancar backend (DEMO)
        run: |
          cd PronoScore360/backend
          export DATABASE_URL=postgresql+psycopg://pronoscore:pronoscore@localhost:5432/pronoscore ENV=local SEED_DEMO_ON_START=true PYTHONPATH=. AUTH_RATE_LIMIT_PER_MINUTE=1000
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8000/api/v1/health && break; sleep 2; done
      - run: bash PronoScore360/tests/e2e/smoke.sh
      - run: cd PronoScore360/web && npm run test:integration
      - run: cd PronoScore360/android && ./gradlew :core:test -PskipApp=true --no-daemon
      - if: failure()
        run: tail -n 100 /tmp/api.log

  android-app:
    name: Android app (assembleDebug + pruebas unitarias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd PronoScore360/android && ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:test --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: PronoScore360/android/app/build/outputs/apk/debug/app-debug.apk }
