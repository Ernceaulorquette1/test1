[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pronoscore-analytics"
version = "1.0.0"
description = "PronoScore360 Analytics: modelos de predicción deportiva"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["pronoscore_analytics*"]

[tool.pytest.ini_options]
pythonpath = ["tests", "."]
testpaths = ["tests"]
