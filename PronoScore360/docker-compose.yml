# Desarrollo local: PostgreSQL + Redis + API + Web. Copia .env.example a .env antes.
name: pronoscore360
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pronoscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pronoscore}
      POSTGRES_DB: ${POSTGRES_DB:-pronoscore}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pronoscore} -d ${POSTGRES_DB:-pronoscore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pronoscore}:${POSTGRES_PASSWORD:-pronoscore}@db:5432/${POSTGRES_DB:-pronoscore}
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-local}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
  web:
    build:
      context: ./web
      args: {VITE_API_URL: "${VITE_API_URL:-http://localhost:8000/api/v1}"}
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
